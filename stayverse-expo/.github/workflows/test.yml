name: Test

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: stayverse-expo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: stayverse-expo/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit & integration tests
        run: pnpm test

      - name: Core coverage (≥70%)
        run: pnpm test:coverage
